[project]
name = "chef-backend"
version = "0.1.0"
description = "Backend API and MCP server for Chef, an AI-first personal recipe assistant."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=7.7.0",
    "google-cloud-firestore>=2.34.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use obviously fake token strings.
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
